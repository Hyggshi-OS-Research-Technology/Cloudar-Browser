name: Build & Check

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Check for errors (syntax + headless startup smoke test)
  # ------------------------------------------------------------------
  check:
    name: Check for errors
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install system dependencies (Qt / WebEngine)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libnss3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libasound2t64 \
            libdbus-1-3 libfontconfig1 libfreetype6 libx11-xcb1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-shm0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libxext6 libxrender1 xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (byte-compile all Python sources)
        run: |
          python -m compileall -q \
            core config features extensions internal_pages lang \
            resources tests tools main.py file.py

      - name: Dependency import smoke test
        run: |
          python -c "import PyQt6, PyQt6.QtWebEngineCore, PyQt6.QtWebEngineWidgets; print('PyQt6 imports OK')"

      - name: Headless startup smoke test
        # Launch the app under xvfb for a short time and fail if it crashes
        run: |
          set -e
          export CLOUDAR_DEBUG=1
          timeout 30 xvfb-run -a python main.py &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "App is still running (healthy), stopping it."
            kill $PID || true
            wait $PID || true
          else
            wait $PID && echo "App exited cleanly." || { echo "App crashed during startup!"; exit 1; }
          fi

  # ------------------------------------------------------------------
  # Job 2: Full build (Briefcase, Linux)
  # ------------------------------------------------------------------
  build:
    name: Build (Linux / Briefcase)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip curl file \
            libegl1 libgl1 libnss3 libxkbcommon0 xvfb

      - name: Install Briefcase + project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install briefcase
          pip install -r requirements.txt

      - name: Create Briefcase project (Linux)
        run: briefcase create linux --no-input

      - name: Build the application
        run: briefcase build linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudar-browser-linux
          path: |
            build/linux/**/*.x86_64
            build/linux/**/app
          if-no-files-found: warn
