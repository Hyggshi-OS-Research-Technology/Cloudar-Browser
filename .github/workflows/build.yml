name: Build & Test (C++ Qt6)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Verify (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt6 & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev \
            xvfb libgl1-mesa-dri libgl1-mesa-glx

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          ninja -C build -j$(nproc)

      - name: Verify Binary
        run: |
          ls -lh build/cloudar-browser
          file build/cloudar-browser

      - name: Headless Smoke Test
        run: |
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export QTWEBENGINE_CHROMIUM_FLAGS="--no-sandbox --disable-gpu"
          xvfb-run -a ./build/cloudar-browser --version
          # Run GUI test for 8 seconds under xvfb, exit code 124 (timeout) is expected for GUI apps
          timeout 8 xvfb-run -a ./build/cloudar-browser || [ $? -eq 124 ]
          echo "Headless smoke test passed successfully."

      - name: Package Artifacts
        run: |
          mkdir -p dist
          cp build/cloudar-browser dist/
          cp run_cpp.sh dist/
          chmod +x dist/run_cpp.sh dist/cloudar-browser

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudar-browser-linux-x86_64
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cloudar-browser
            dist/run_cpp.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
