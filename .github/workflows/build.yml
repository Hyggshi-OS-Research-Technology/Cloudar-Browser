name: Build & Test (C++ Qt6)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The LTS distributions that actually ship Qt 6 WebEngine. Debian 11
          # and Ubuntu 20.04 are intentionally absent: they have no
          # qt6-webengine-dev, so they belong to the legacy branch, not here.
          # See docs/PLATFORM_MATRIX.md.
          - os: ubuntu-24.04
            qt: distro
            label: Ubuntu 24.04 LTS
          - os: ubuntu-22.04
            qt: distro
            label: Ubuntu 22.04 LTS
          - os: ubuntu-24.04
            qt: 6.8.3
            label: Ubuntu 24.04 + Qt 6.8 LTS (installer)
          - os: ubuntu-24.04
            qt: 6.10.0
            label: Ubuntu 24.04 + Qt 6.10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install base build tools
        run: |
          sudo apt-get update
          # None of the *-dev packages below are optional on Ubuntu 22.04:
          # Qt6Gui's CMake config calls find_package(WrapOpenGL) and checks for
          # XKB, fontconfig/freetype and dbus, so without the development
          # headers configure fails before a single line is compiled. The
          # runtime libraries at the end are for the smoke tests, not linking.
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 libnss3
          # libasound2 was renamed to libasound2t64 in 24.04. Installing both in
          # one apt command made the *whole* line fail on 22.04 (unknown
          # package), and the old `|| fallback` then left the job without even
          # libgl-dev -- which is why configure reported OpenGL missing on
          # 22.04 and fine on 24.04.
          sudo apt-get install -y --no-install-recommends libasound2t64 \
          || sudo apt-get install -y --no-install-recommends libasound2

      - name: Install Qt 6 (distribution packages)
        if: matrix.qt == 'distro'
        run: |
          # Ubuntu 22.04's Qt 6.2 splits Qt6OpenGL into libqt6opengl6-dev, and
          # Qt6Gui's CMake config requires it there; without it configure dies
          # with "Could NOT find Qt6OpenGL (missing: Qt6OpenGL_DIR)". Ubuntu
          # 24.04's Qt 6.4 folds it into qt6-base-dev and has no such package,
          # so the extra install must not be allowed to abort the job.
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev
          if ! sudo apt-get install -y --no-install-recommends libqt6opengl6-dev; then
            echo "libqt6opengl6-dev not needed on this release (expected on 24.04)"
          fi
          # QtWebEngine renders through a separate helper process. On Ubuntu
          # 22.04 that binary lives in libqt6webenginecore6-bin, which
          # qt6-webengine-dev does not pull in, so the browser aborted with
          # "Could not find QtWebEngineProcess" the moment it created a page.
          # 24.04 ships it inside the core package and has no such package name.
          if ! sudo apt-get install -y --no-install-recommends libqt6webenginecore6-bin; then
            echo "libqt6webenginecore6-bin not needed on this release (expected on 24.04)"
          fi

      - name: Install Qt ${{ matrix.qt }} (official installer)
        if: matrix.qt != 'distro'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Install QtWebEngine runtime dependencies (installer Qt only)
        if: matrix.qt != 'distro'
        run: |
          # The official Qt build links none of these, but QtWebEngine dlopen()s
          # them at run time for its own sandbox and X11 integration. The distro
          # qt6-webengine-dev package declares them as dependencies; the
          # installer tarball cannot, so install them here. libasound2 is left to
          # the base-tools step above, which already picks the right name.
          sudo apt-get install -y --no-install-recommends \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxcursor1

      - name: Check New Tab assets and bridge surface
        run: |
          # Every script the New Tab page loads must be in the qrc, every
          # `bridge.x()` call must exist in NewTabBridge, and the classic chrome
          # must actually have rules (it had none on this page, which is the bug
          # this check exists to prevent). Runs before the expensive Qt build so
          # a typo costs seconds instead of twenty minutes.
          node tools/check-newtab.js

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build with Ninja
        run: |
          # Compiler diagnostics are the one thing a failed build always has, but
          # they only live in the step log — which is not readable from every
          # tool that needs to triage a run. Re-publish the error lines as
          # annotations so a failure explains itself. The build still fails
          # normally through the exit status.
          set +e
          ninja -C build -j$(nproc) 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ $status -ne 0 ]; then
            grep -E 'error:|error C[0-9]+|undefined reference|fatal error' build.log \
              | head -n 8 | while IFS= read -r line; do
                echo "::error title=compile::$line"
              done
            exit $status
          fi

      - name: Verify binary
        run: |
          ls -lh build/cloudar-browser
          file build/cloudar-browser

      - name: Performance tier unit smoke (no display needed)
        run: |
          # --version exercises PerformanceProfile::applyEnvironment(), the
          # theme lookup and the CLI parser without creating a window.
          ./build/cloudar-browser --version
          CLOUDAR_PERF_TIER=legacy ./build/cloudar-browser --version
          CLOUDAR_THEME=modern ./build/cloudar-browser --version

      - name: Headless smoke test (classic chrome)
        run: |
          # QTWEBENGINE_DISABLE_SANDBOX is a *CI runner* concession, not a
          # product setting: GitHub's containers restrict the user namespace
          # Chromium's sandbox needs, so the browser cannot start otherwise.
          # Nothing in src/ ever sets this, and the shipped binary keeps the
          # sandbox on (see docs/CPU_COMPATIBILITY.md).
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export QT_QPA_PLATFORM=xcb
          # Xvfb has no GPU, so ask for software GL. This is a CI setting for a
          # machine without a graphics device, not a product default.
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_OPENGL=software
          # QtWebEngine renders in a helper process. Running the binary straight
          # from the build tree, Qt looks for that helper relative to its own
          # installation; naming it explicitly removes the guesswork and turns a
          # missing package into a readable message instead of exit 134
          # (SIGABRT from qFatal("Could not find QtWebEngineProcess")).
          #
          # Both Qt layouts have to be covered: the distro Qt puts it under /usr,
          # while the official installer puts it in the Qt tree that the
          # install-qt-action exports as Qt6_DIR.
          helper="$(find "$Qt6_DIR/.." "$QT_ROOT_DIR" /usr -name QtWebEngineProcess -type f 2>/dev/null | head -n 1)"
          if [ -z "$helper" ]; then
            echo "::error::QtWebEngineProcess not found - install libqt6webenginecore6-bin (distro Qt)"
            exit 1
          fi
          echo "QtWebEngineProcess: $helper"
          export QTWEBENGINEPROCESS_PATH="$helper"
          # The app must still be alive when the timeout fires (124). Exiting on
          # its own -- even with status 0 -- means it never reached the event
          # loop, which is a failure worth catching.
          start=$SECONDS
          set +e
          timeout 12 xvfb-run -a ./build/cloudar-browser --classic > smoke-classic.log 2>&1
          status=$?
          set -e
          if [ $status -ne 124 ]; then
            echo "::error::classic chrome exited with $status after $((SECONDS-start))s (expected 124)"
            # The reason is in the log, and CI logs are not always readable from
            # where this is being debugged -- surface the last lines verbatim.
            tail -n 15 smoke-classic.log | while IFS= read -r line; do
              echo "::error title=classic::$line"
            done
            exit 1
          fi
          echo "Classic chrome stayed up for 12s."

      - name: Headless smoke test (modern chrome)
        run: |
          export QTWEBENGINE_DISABLE_SANDBOX=1   # CI runner only, see above
          export QT_QPA_PLATFORM=xcb
          export LIBGL_ALWAYS_SOFTWARE=1         # Xvfb has no GPU, see above
          export QT_OPENGL=software
          helper="$(find "$Qt6_DIR/.." "$QT_ROOT_DIR" /usr -name QtWebEngineProcess -type f 2>/dev/null | head -n 1)"
          if [ -z "$helper" ]; then
            echo "::error::QtWebEngineProcess not found - install libqt6webenginecore6-bin (distro Qt)"
            exit 1
          fi
          echo "QtWebEngineProcess: $helper"
          export QTWEBENGINEPROCESS_PATH="$helper"
          set +e
          timeout 12 xvfb-run -a ./build/cloudar-browser --modern > smoke-modern.log 2>&1
          status=$?
          set -e
          if [ $status -ne 124 ]; then
            echo "::error::modern chrome exited with $status (expected 124)"
            tail -n 15 smoke-modern.log | while IFS= read -r line; do
              echo "::error title=modern::$line"
            done
            exit 1
          fi
          echo "Modern chrome stayed up for 12s."

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp build/cloudar-browser dist/
          cp run_cpp.sh dist/
          chmod +x dist/run_cpp.sh dist/cloudar-browser

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudar-browser-${{ matrix.os }}-qt${{ matrix.qt }}
          path: dist/
          if-no-files-found: error

  windows:
    # Windows 8/8.1/7 are NOT in this matrix on purpose: Qt 6 cannot target
    # them. See docs/PLATFORM_MATRIX.md for the legacy branch plan.
    name: Windows ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            qt: 6.8.3
            label: Windows Server 2022 (Win10 API) + Qt 6.8 LTS
          - os: windows-2025
            qt: 6.10.0
            label: Windows Server 2025 (Win11 API) + Qt 6.10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt ${{ matrix.qt }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: win64_msvc2022_64
          # qtpositioning is a hard dependency of Qt6WebEngineCore's CMake
          # config (Qt6WebEngineCoreConfig calls find_dependency(Qt6Positioning)).
          # Leaving it out fails configure with "Qt6Positioning_DIR not found",
          # which is what happened before this was added.
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true

      - name: Set up the MSVC environment
        # Without this, Ninja picks up the MinGW gcc that is also on the PATH and
        # links against a Qt that was built with MSVC: every Qt symbol comes back
        # as an undefined reference.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Provide zlib (vcpkg)
        # Windows has no system zlib, and CrxInstaller needs it to inflate CRX
        # payloads. vcpkg is preinstalled on the GitHub Windows images and is
        # the supported way to get a CMake-config-compatible zlib here.
        run: vcpkg install zlib:x64-windows

      - name: Configure CMake
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Version smoke test
        run: .\build\cloudar-browser.exe --version

      - name: Deploy Qt runtime
        run: |
          windeployqt --release --no-translations --webenginewidgets build\cloudar-browser.exe

      - name: Package artifact
        run: |
          mkdir dist
          Copy-Item build\cloudar-browser.exe dist\
          # run_cpp.sh is a bash helper for the Linux packages; it is useless on
          # Windows and shipping it there only invites "how do I run this" issues.
          Compress-Archive -Path dist\* -DestinationPath cloudar-windows-${{ matrix.qt }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudar-windows-${{ matrix.qt }}
          path: cloudar-windows-${{ matrix.qt }}.zip
          if-no-files-found: error

  release:
    name: Attach artifacts to release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
