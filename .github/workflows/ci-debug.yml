name: CI debug (temporary)
on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:
jobs:
  cfg22:
    name: 22.04 exact base-tools list
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Base (copy of build.yml)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 \
            libnss3 libasound2t64 || sudo apt-get install -y --no-install-recommends libnss3 libasound2
      - name: Qt (copy of build.yml)
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev
          if ! sudo apt-get install -y --no-install-recommends libqt6opengl6-dev; then
            echo "opengl pkg not present"
          fi
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || true
          grep -nE "Could not find|Expected Config|missing:|CMake Error|error" cfg.log | head -9 | while IFS= read -r l; do
            echo "::error title=cfg::$l"
          done
