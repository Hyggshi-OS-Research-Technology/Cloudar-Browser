name: CI debug (temporary)
on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:
jobs:
  try22:
    name: 22.04 smoke variants
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Base
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 libnss3
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - name: Qt
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev
          sudo apt-get install -y --no-install-recommends libqt6opengl6-dev || true
      - name: Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build -j4
      - name: Try variants
        run: |
          run() {
            name="$1"; shift
            set +e
            timeout 15 xvfb-run -a env "$@" ./build/cloudar-browser --classic > "out-$name.log" 2>&1
            code=$?
            set -e
            echo "variant $name -> exit $code"
            if [ $code -eq 124 ]; then
              echo "::error title=WIN::variant $name survived"
            else
              tail -3 "out-$name.log" | while IFS= read -r l; do
                echo "::warning title=$name::${l//'%'/'%25'}"
              done
            fi
          }
          run 1 QTWEBENGINE_DISABLE_SANDBOX=1 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 QT_OPENGL=software
          run 2 QTWEBENGINE_DISABLE_SANDBOX=1 QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 QT_OPENGL=software QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --disable-gpu-compositing"
          run 3 QTWEBENGINE_DISABLE_SANDBOX=1 QT_QPA_PLATFORM=offscreen LIBGL_ALWAYS_SOFTWARE=1
