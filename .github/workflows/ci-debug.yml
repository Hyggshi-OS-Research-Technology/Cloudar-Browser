name: CI debug (temporary)

on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:

jobs:
  cfg22:
    name: Ubuntu 22.04 exact CI packages
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Base
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev
      - name: Qt (exact build.yml logic)
        run: |
          set +e
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools qt6-opengl-dev \
            qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev > apt1.log 2>&1
          echo "superset apt=$?"
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev > apt2.log 2>&1
          echo "fallback apt=$?"
          echo "--- Qt6OpenGL present? ---"
          ls /usr/lib/x86_64-linux-gnu/cmake/ | grep -i opengl | head
          dpkg -l | grep -i "qt6-opengl\|libqt6opengl" | head -3
      - name: Configure
        run: |
          set +e
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1
          echo "cfg=$?"
          grep -nE "Could not find|Expected Config|missing:|CMake Error|not found" cfg.log | head -10 | while IFS= read -r l; do
            echo "::error title=cfg::$l"
          done
