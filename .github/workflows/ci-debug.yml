name: CI debug (temporary)

on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:

jobs:
  build:
    name: Build errors on ${{ matrix.os }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install base tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev

      - name: Install Qt (distro)
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev

      - name: Configure
        shell: bash
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and annotate every error
        shell: bash
        run: |
          set +e
          ninja -C build -k 0 -j4 > build.log 2>&1
          rc=$?
          echo "ninja exit=$rc"
          grep -E "error:" build.log | sed 's|.*/src/|src/|' | sort -u | head -10 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            echo "::error title=build::${line}"
          done
          exit $rc
