name: CI debug (temporary)
on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:
jobs:
  bt22:
    name: 22.04 classic crash backtrace
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Base
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev gdb \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype6-dev libdbus-1-dev \
            xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 libnss3
          sudo apt-get install -y --no-install-recommends libasound2t64 || sudo apt-get install -y --no-install-recommends libasound2
      - name: Qt
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev
          sudo apt-get install -y --no-install-recommends libqt6opengl6-dev || echo "no libqt6opengl6-dev"
      - name: Build
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          ninja -C build -j4
      - name: Run under gdb
        run: |
          export QTWEBENGINE_DISABLE_SANDBOX=1
          export QT_QPA_PLATFORM=xcb
          timeout 60 xvfb-run -a gdb -batch -ex "run --classic" -ex "bt 30" ./build/cloudar-browser > gdb.log 2>&1 || true
          grep -E "^#[0-9]+ |SIGSEGV|SIGABRT|Aborted|signal" gdb.log | head -10 | while IFS= read -r l; do
            echo "::error title=bt::${l}"
          done
