name: CI debug (temporary)

on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:

jobs:
  win:
    name: Windows errors
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: 'qtwebengine qtwebchannel qtpositioning'
          cache: true
      - uses: ilammy/msvc-dev-cmd@v1
        with: { arch: x64 }
      - name: zlib
        shell: pwsh
        run: vcpkg install zlib:x64-windows
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build and dump
        shell: pwsh
        run: |
          $out = cmake --build build --config Release 2>&1 | Out-String
          $lines = $out -split "`r?`n" | Where-Object { $_ -match 'error|FAILED|undefined' } | Select-Object -First 6
          if (-not $lines) { $lines = ($out -split "`r?`n") | Select-Object -Last 6 }
          foreach ($l in $lines) { Write-Output ("::error title=win::" + ($l.Trim() -replace '%','%25')) }

  cfg22:
    name: 22.04 configure detail
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Base
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev \
            libgl-dev libglu1-mesa-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Qt
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev || true
          sudo apt-get install -y --no-install-recommends libqt6opengl6-dev || echo "no opengl pkg"
          echo "--- available opengl packages ---"
          apt-cache search qt6 2>/dev/null | grep -i opengl | head -5
          ls /usr/lib/x86_64-linux-gnu/cmake/ | grep -i opengl | head
      - name: Configure
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release > cfg.log 2>&1 || true
          grep -nE "Could not find|Expected Config|missing:|CMake Error" cfg.log | head -8 | while IFS= read -r l; do
            echo "::error title=cfg::$l"
          done
