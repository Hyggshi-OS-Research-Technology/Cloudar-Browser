name: CI debug (temporary)

on:
  push:
    branches: ["arena/3cab4054-cloudar-browser"]
  workflow_dispatch:

jobs:
  build:
    name: Build errors on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt: distro

    steps:
      - uses: actions/checkout@v4

      - name: Install base tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build zlib1g-dev libgl-dev libglu1-mesa-dev \
            xvfb libgl1-mesa-dri libgl1 libegl1 libxkbcommon-x11-0 \
            libnss3 libasound2t64 || sudo apt-get install -y --no-install-recommends libnss3 libasound2

      - name: Install Qt (distro)
        if: matrix.qt == 'distro'
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6webenginewidgets6 libqt6webchannel6-dev

      - name: Configure
        shell: bash
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build and annotate every error
        shell: bash
        run: |
          set +e
          ninja -C build -j4 > build.log 2>&1
          rc=$?
          echo "ninja exit=$rc"
          # error lines plus the file:line directly above them
          grep -nE "error:|Error|FAILED:" build.log | head -10 | while IFS= read -r line; do
            line="${line//'%'/'%25'}"; line="${line//$'\r'/}"
            echo "::error title=build::${line}"
          done
          exit $rc
