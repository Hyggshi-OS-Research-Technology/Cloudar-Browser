<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permissions</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151923;
      --panel-2: #1b2230;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #f59e0b;
      --border: rgba(255,255,255,0.08);
    }
    /* ---------------------------------------------------------------------
       Classic (Chrome 2009) chrome. BrowserTabWidget writes the active chrome
       to localStorage before this page's scripts run, so the class is applied
       without a flash. Same beige Win32 palette as cloudar://settings: a dark
       glowing card inside a decorated grey window reads as a bug, not a style.
       --------------------------------------------------------------------- */
    html.classic {
      --bg: #e8e8e8;
      --panel: #ffffff;
      --panel-2: #f4f4f4;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #a0a0a0;
    }

    html.classic body {
      font-family: Tahoma, "Segoe UI", Verdana, sans-serif;
      font-size: 12px;
      background: var(--bg);
    }

    html.classic header {
      padding: 6px 10px;
      background: linear-gradient(#f6f6f6, #dcdcdc);
      border-bottom: 1px solid var(--border);
      backdrop-filter: none;
    }

    html.classic h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    html.classic .panel,
    html.classic .card,
    html.classic .row,
    html.classic .bookmark-card,
    html.classic .layout {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    html.classic button,
    html.classic select,
    html.classic input {
      border-radius: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 2px 8px;
    }

    html.classic button:hover,
    html.classic select:hover {
      background: #e4eefb;
      border-color: #9fc3ef;
    }

    html.classic code {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 0;
      font-size: 11px;
    }

    html.classic .folder-item.active,
    html.classic .tag {
      background: #c3daf5;
      border: 1px solid #7da2ce;
      border-radius: 0;
      color: #1a1a1a;
    }

    html.classic .progress {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 0;
    }

    html.classic .progress > div {
      background: #3a9b3a;
      border-radius: 0;
    }

    html.classic .toggle {
      border-radius: 0;
    }

    html.classic .toggle::after {
      border-radius: 0;
    }

    html.classic th {
      color: #1a1a1a;
      text-transform: none;
      letter-spacing: 0;
      background: var(--panel-2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 500px at 70% -20%, rgba(245,158,11,0.18), transparent), var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 24px; }
    button {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .table {
      padding: 16px 24px 24px;
      overflow: auto;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    select {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 8px;
      border-radius: 8px;
    }
    .empty { color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Permissions</h1>
    <button id="clear">Clear All</button>
  </header>
  <div class="table" id="table"></div>

  <script>
    // The active chrome, written to localStorage by the native side on every
    // internal page load (BrowserTabWidget::wireView). Read before rendering so
    // the classic palette is in place instead of flashing dark first.
    (function applyChromeStyle() {
      try {
        if (localStorage.getItem('cloudar.chromeStyle') === 'classic')
          document.documentElement.classList.add('classic');
      } catch (e) { /* storage disabled: stay with the modern look */ }
    })();

    let bridge = null;
    const tableEl = document.getElementById('table');
    // Must match PermissionStore's capability names. The engine also has
    // "camera and microphone", "pointer lock", "screen sharing", "screen and
    // audio sharing", "clipboard" and "local fonts"; they are edited here too,
    // because a row that exists in storage but has no control would be a
    // preference the user cannot change or clear.
    const permKeys = [
      'camera', 'microphone', 'location', 'notifications',
      'camera and microphone', 'pointer lock', 'screen sharing',
      'screen and audio sharing', 'clipboard', 'local fonts'
    ];
    const permLabels = {
      'camera': 'Camera',
      'microphone': 'Microphone',
      'location': 'Location',
      'notifications': 'Notifications',
      'camera and microphone': 'Cam + Mic',
      'pointer lock': 'Pointer',
      'screen sharing': 'Screen',
      'screen and audio sharing': 'Screen + Audio',
      'clipboard': 'Clipboard',
      'local fonts': 'Fonts'
    };

    const buildSelect = (origin, key, value) => {
      const select = document.createElement('select');
      ['ask', 'allow', 'deny'].forEach((opt) => {
        const o = document.createElement('option');
        o.value = opt;
        o.textContent = opt;
        if (opt === value) o.selected = true;
        select.appendChild(o);
      });
      select.onchange = () => bridge.setPermission(origin, key, select.value);
      return select;
    };

    const render = (data) => {
      const origins = Object.keys(data || {});
      if (!origins.length) {
        tableEl.innerHTML = '<div class="empty">No permissions stored yet.</div>';
        return;
      }

      const table = document.createElement('table');
      const thead = document.createElement('thead');
      thead.innerHTML = '<tr><th>Site</th>' + permKeys
        .map((key) => `<th>${permLabels[key] || key}</th>`)
        .join('') + '</tr>';
      table.appendChild(thead);
      const tbody = document.createElement('tbody');

      origins.forEach((origin) => {
        const row = document.createElement('tr');
        const perms = data[origin] || {};
        row.appendChild(Object.assign(document.createElement('td'), { textContent: origin }));
        permKeys.forEach((key) => {
          const td = document.createElement('td');
          td.appendChild(buildSelect(origin, key, perms[key] || 'ask'));
          row.appendChild(td);
        });
        tbody.appendChild(row);
      });
      table.appendChild(tbody);
      tableEl.innerHTML = '';
      tableEl.appendChild(table);
    };

    const load = () => {
      if (!bridge) return;
      bridge.getPermissions((data) => render(data || {}));
    };

    document.getElementById('clear').onclick = () => {
      if (confirm('Clear all saved permissions?')) {
        bridge.clearPermissions();
      }
    };

    const initChannel = () => {
      if (typeof qt === 'undefined') return;
      new QWebChannel(qt.webChannelTransport, (channel) => {
        bridge = channel.objects.internalBridge;
        if (!bridge) return;
        if (bridge.permissionsChanged) bridge.permissionsChanged.connect(load);
        load();
      });
    };

    window.addEventListener('DOMContentLoaded', initChannel);
  </script>
</body>
</html>
