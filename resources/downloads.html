<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Downloads</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151923;
      --panel-2: #1b2230;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #22c55e;
      --border: rgba(255,255,255,0.08);
    }
    /* ---------------------------------------------------------------------
       Classic (Chrome 2009) chrome. BrowserTabWidget writes the active chrome
       to localStorage before this page's scripts run, so the class is applied
       without a flash. Same beige Win32 palette as cloudar://settings: a dark
       glowing card inside a decorated grey window reads as a bug, not a style.
       --------------------------------------------------------------------- */
    /* Light mode. The modern chrome now has two surfaces; these pages were
       dark-only, which meant a light window showed a white toolbar around a
       black page. Same tokens, re-pointed at a light surface — the shapes,
       spacing and radii above are untouched, so this is one palette swap and
       not a second design.

       System mode is handled in CSS *and* JS: the attribute carries the resolved
       answer, and prefers-color-scheme is the fallback for the window before the
       bridge has answered (see the bootstrap in <head>). */
    html[data-color-mode="light"]:not(.classic) {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --panel-2: #f1f2f5;
      --panel-3: #eceef3;
      --text: #1a1d24;
      --muted: #5b6273;
      --border: #d6dae2;
    }

    @media (prefers-color-scheme: light) {
      html[data-color-mode="auto"]:not(.classic) {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --panel-2: #f1f2f5;
        --panel-3: #eceef3;
        --text: #1a1d24;
        --muted: #5b6273;
        --border: #d6dae2;
      }
    }

    html.classic {
      --bg: #e8e8e8;
      --panel: #ffffff;
      --panel-2: #f4f4f4;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #a0a0a0;
    }

    html.classic body {
      font-family: Tahoma, "Segoe UI", Verdana, sans-serif;
      font-size: 12px;
      background: var(--bg);
    }

    html.classic header {
      padding: 6px 10px;
      background: linear-gradient(#f6f6f6, #dcdcdc);
      border-bottom: 1px solid var(--border);
      backdrop-filter: none;
    }

    html.classic h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    html.classic .panel,
    html.classic .card,
    html.classic .row,
    html.classic .bookmark-card,
    html.classic .layout {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    html.classic button,
    html.classic select,
    html.classic input {
      border-radius: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 2px 8px;
    }

    html.classic button:hover,
    html.classic select:hover {
      background: #e4eefb;
      border-color: #9fc3ef;
    }

    html.classic code {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 0;
      font-size: 11px;
    }

    html.classic .folder-item.active,
    html.classic .tag {
      background: #c3daf5;
      border: 1px solid #7da2ce;
      border-radius: 0;
      color: #1a1a1a;
    }

    html.classic .progress {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 0;
    }

    html.classic .progress > div {
      background: #3a9b3a;
      border-radius: 0;
    }

    html.classic .toggle {
      border-radius: 0;
    }

    html.classic .toggle::after {
      border-radius: 0;
    }

    html.classic th {
      color: #1a1a1a;
      text-transform: none;
      letter-spacing: 0;
      background: var(--panel-2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 500px at 20% -20%, rgba(34,197,94,0.16), transparent), var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 24px; }
    .list {
      padding: 16px 24px 24px;
      overflow: auto;
      flex: 1;
    }
    .row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .name { font-weight: 600; }
    .status { color: var(--muted); font-size: 12px; }
    .progress {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress > div {
      height: 100%;
      background: var(--accent);
      width: 0;
      transition: width 0.2s ease;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .empty { color: var(--muted); text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <header>
    <h1>Downloads</h1>
  </header>
  <div class="list" id="list"></div>

  <script>
    // The active chrome, written to localStorage by the native side on every
    // internal page load (BrowserTabWidget::wireView). Read before rendering so
    // the classic palette is in place instead of flashing dark first.
    (function applyChromeStyle() {
      try {
        if (localStorage.getItem('cloudar.chromeStyle') === 'classic')
          document.documentElement.classList.add('classic');
        // The native side writes the resolved light/dark answer on every load
        // (BrowserTabWidget::wireView). Reading the cached copy here keeps a
        // light window from flashing its dark page before the page script runs;
        // "auto" defers to the OS through prefers-color-scheme.
        var cachedMode = localStorage.getItem('cloudar.colorMode');
        if (cachedMode)
          document.documentElement.setAttribute('data-color-mode', cachedMode);
      } catch (e) { /* storage disabled: stay with the modern look */ }
    })();

    let bridge = null;
    const listEl = document.getElementById('list');

    const statusText = (item, active) => {
      if (item.cancelled) return 'Cancelled';
      if (item.completed) return 'Completed';
      if (active && item.paused) return 'Paused';
      if (active) return `Downloading ${item.progress || 0}%`;
      return 'Interrupted';
    };

    const render = (items) => {
      listEl.innerHTML = '';
      if (!items || !items.length) {
        listEl.innerHTML = '<div class="empty">No downloads yet.</div>';
        return;
      }

      items.forEach((item) => {
        const active = !item.completed && !item.cancelled && (item.progress < 100);
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
          <div class="row-top">
            <div>
              <div class="name">${item.filename}</div>
              <div class="status">${statusText(item, active)}</div>
            </div>
          </div>
          <div class="progress"><div style="width:${item.progress || 0}%"></div></div>
          <div class="actions"></div>
        `;

        const actions = row.querySelector('.actions');
        const addBtn = (label, onClick) => {
          const b = document.createElement('button');
          b.textContent = label;
          b.onclick = onClick;
          actions.appendChild(b);
        };

        if (item.completed) {
          addBtn('Open', () => bridge.openDownload(item.filename));
        }
        addBtn('Show in Folder', () => bridge.showInFolder(item.filename));

        if (active) {
          addBtn(item.paused ? 'Resume' : 'Pause', () => {
            if (item.paused) bridge.resumeDownload(item.filename);
            else bridge.pauseDownload(item.filename);
          });
          addBtn('Cancel', () => bridge.cancelDownload(item.filename));
        }

        listEl.appendChild(row);
      });
    };

    const load = () => {
      if (!bridge) return;
      bridge.getDownloads((items) => render(items));
    };

    const initChannel = () => {
      if (typeof qt === 'undefined') return;
      new QWebChannel(qt.webChannelTransport, (channel) => {
        bridge = channel.objects.internalBridge;
        if (!bridge) return;
        if (bridge.downloadsChanged) bridge.downloadsChanged.connect(load);
        load();
      });
    };

    window.addEventListener('DOMContentLoaded', initChannel);
  </script>
</body>
</html>
