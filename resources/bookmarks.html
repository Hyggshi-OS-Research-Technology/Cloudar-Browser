<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks</title>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #151923;
      --panel-2: #1b2230;
      --text: #e6edf3;
      --muted: #9aa4b2;
      --accent: #4fd1c5;
      --border: rgba(255,255,255,0.08);
    }
    /* ---------------------------------------------------------------------
       Classic (Chrome 2009) chrome. BrowserTabWidget writes the active chrome
       to localStorage before this page's scripts run, so the class is applied
       without a flash. Same beige Win32 palette as cloudar://settings: a dark
       glowing card inside a decorated grey window reads as a bug, not a style.
       --------------------------------------------------------------------- */
    html.classic {
      --bg: #e8e8e8;
      --panel: #ffffff;
      --panel-2: #f4f4f4;
      --text: #1a1a1a;
      --muted: #6b6b6b;
      --border: #a0a0a0;
    }

    html.classic body {
      font-family: Tahoma, "Segoe UI", Verdana, sans-serif;
      font-size: 12px;
      background: var(--bg);
    }

    html.classic header {
      padding: 6px 10px;
      background: linear-gradient(#f6f6f6, #dcdcdc);
      border-bottom: 1px solid var(--border);
      backdrop-filter: none;
    }

    html.classic h1 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0;
    }

    html.classic .panel,
    html.classic .card,
    html.classic .row,
    html.classic .bookmark-card,
    html.classic .layout {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      box-shadow: none;
      backdrop-filter: none;
    }

    html.classic button,
    html.classic select,
    html.classic input {
      border-radius: 0;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 2px 8px;
    }

    html.classic button:hover,
    html.classic select:hover {
      background: #e4eefb;
      border-color: #9fc3ef;
    }

    html.classic code {
      background: #f0f0f0;
      border: 1px solid #d0d0d0;
      border-radius: 0;
      font-size: 11px;
    }

    html.classic .folder-item.active,
    html.classic .tag {
      background: #c3daf5;
      border: 1px solid #7da2ce;
      border-radius: 0;
      color: #1a1a1a;
    }

    html.classic .progress {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 0;
    }

    html.classic .progress > div {
      background: #3a9b3a;
      border-radius: 0;
    }

    html.classic .toggle {
      border-radius: 0;
    }

    html.classic .toggle::after {
      border-radius: 0;
    }

    html.classic th {
      color: #1a1a1a;
      text-transform: none;
      letter-spacing: 0;
      background: var(--panel-2);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 500px at 20% -10%, rgba(79,209,197,0.15), transparent), var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(15,17,21,0.9);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 24px; }
    .actions { display: flex; gap: 10px; }
    button {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.primary { background: var(--accent); color: #0b0f12; border: none; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 16px;
      padding: 16px 24px 24px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      overflow: auto;
    }
    .folder-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .folder-item.active { background: var(--panel-2); }
    .folder-item:hover { background: rgba(255,255,255,0.05); }
    .folder-item span { color: var(--muted); font-size: 13px; }
    .bookmark-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: var(--panel-2);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
    }
    .bookmark-title { font-weight: 600; }
    .bookmark-url { color: var(--muted); font-size: 12px; }
    .bookmark-actions { display: flex; gap: 6px; }
    .empty { color: var(--muted); text-align: center; padding: 20px; }
    .tag { font-size: 11px; background: rgba(79,209,197,0.2); color: var(--accent); padding: 2px 6px; border-radius: 999px; }
  </style>
</head>
<body>
  <header>
    <h1>Bookmarks</h1>
    <div class="actions">
      <button id="add-folder">Add Folder</button>
      <button id="add-bookmark" class="primary">Add Bookmark</button>
    </div>
  </header>
  <div class="layout">
    <div class="panel" id="folders"></div>
    <div class="panel" id="bookmarks"></div>
  </div>

  <script>
    // The active chrome, written to localStorage by the native side on every
    // internal page load (BrowserTabWidget::wireView). Read before rendering so
    // the classic palette is in place instead of flashing dark first.
    (function applyChromeStyle() {
      try {
        if (localStorage.getItem('cloudar.chromeStyle') === 'classic')
          document.documentElement.classList.add('classic');
      } catch (e) { /* storage disabled: stay with the modern look */ }
    })();

    let bridge = null;
    let currentFolder = '';

    const foldersEl = document.getElementById('folders');
    const bookmarksEl = document.getElementById('bookmarks');

    const render = (data) => {
      const folders = ['All'].concat(data.folders || []);
      foldersEl.innerHTML = '';
      folders.forEach((name) => {
        const row = document.createElement('div');
        row.className = 'folder-item' + ((currentFolder === name || (name === 'All' && currentFolder === '')) ? ' active' : '');
        row.innerHTML = `<div>${name}</div>`;
        if (name !== 'All') {
          const del = document.createElement('span');
          del.textContent = 'Remove';
          del.style.cursor = 'pointer';
          del.onclick = (e) => {
            e.stopPropagation();
            if (confirm(`Remove folder "${name}" and its bookmarks?`)) {
              bridge.removeFolder(name, true);
            }
          };
          row.appendChild(del);
        }
        row.onclick = () => {
          currentFolder = name === 'All' ? '' : name;
          render(data);
        };
        foldersEl.appendChild(row);
      });

      const list = (data.bookmarks || []).filter(b => !currentFolder || b.folder === currentFolder);
      bookmarksEl.innerHTML = '';
      if (!list.length) {
        bookmarksEl.innerHTML = '<div class="empty">No bookmarks in this folder.</div>';
        return;
      }
      list.forEach((b) => {
        const card = document.createElement('div');
        card.className = 'bookmark-card';
        card.innerHTML = `
          <div>
            <div class="bookmark-title">${b.title || b.url}</div>
            <div class="bookmark-url">${b.url}</div>
            ${b.folder ? `<div class="tag">${b.folder}</div>` : ''}
          </div>
          <div class="bookmark-actions">
            <button data-open>Open</button>
            <button data-remove>Remove</button>
          </div>
        `;
        card.querySelector('[data-open]').onclick = () => { window.location.href = b.url; };
        card.querySelector('[data-remove]').onclick = () => { bridge.removeBookmark(b.url); };
        bookmarksEl.appendChild(card);
      });
    };

    const load = () => {
      if (!bridge) return;
      bridge.getBookmarks((data) => render(data || {folders: [], bookmarks: []}));
    };

    const addFolder = () => {
      const name = prompt('Folder name');
      if (name) bridge.addFolder(name.trim());
    };

    const addBookmark = () => {
      const title = prompt('Bookmark title');
      const url = prompt('Bookmark URL');
      if (!url) return;
      const folder = prompt('Folder (optional)') || '';
      bridge.addBookmark(title || url, url, folder);
    };

    document.getElementById('add-folder').onclick = addFolder;
    document.getElementById('add-bookmark').onclick = addBookmark;

    const initChannel = () => {
      if (typeof qt === 'undefined') return;
      new QWebChannel(qt.webChannelTransport, (channel) => {
        bridge = channel.objects.internalBridge;
        if (!bridge) return;
        if (bridge.bookmarksChanged) {
          bridge.bookmarksChanged.connect(load);
        }
        load();
      });
    };

    window.addEventListener('DOMContentLoaded', initChannel);
  </script>
</body>
</html>
