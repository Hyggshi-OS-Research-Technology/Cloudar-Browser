<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>About Cloudar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
        }

        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #60cdff, #0078d4);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            font-weight: 600;
            color: white;
            margin: 0 auto 30px;
            box-shadow: 0 10px 30px rgba(96, 205, 255, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 32px;
            letter-spacing: -1px;
        }

        .version {
            color: #8b949e;
            margin: 10px 0 30px;
        }

        p {
            line-height: 1.6;
            color: #7d8590;
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">C</div>
        <h1>Cloudar Browser™</h1>
        <div class="version">Version 1.0.0 (Official Build) 64-bit</div>
        <p>
            Cloudar is a fast, secure, and modern web browser built for productivity and style.
            Experience the web with a new perspective.
        </p>
        <div class="footer">&copy; 2026 Cloudar Team. All rights reserved.</div>
    </div>
</body>

</html>
